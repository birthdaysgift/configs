[ids]

*

[main]


leftalt = layer(controllayer)
leftcontrol = leftalt


#     will produce "esc" if and only if:
#         •   "esc" is struck within 150ms (3rd argument) of another non-action key.
#         •   "esc" is struck more than 150ms (3rd argument) after the last  non-action  key
#             but  held  for less than 150ms (4th argument) and there are no intervening
#             key taps.
#     This reduces the visual latency by immediately resolving the key as
#     a letter when typed midword, but also  facilitates  its  use  as  a
#     layer trigger if it is held for a long enough period with no inter‐
#     vening symbols.
capslock = lettermod(nav, esc, 10, 150)

# line below probably isn't needed if keyboard 60%+ is used
esc = `


[controllayer:C]

h = backspace
j = enter


[nav]

h = left
j = down
k = up
l = right


[global]

macro_timeout = 0
macro_repeat_timeout = 0
macro_sequence_timeout = 0
chord_timeout = 0
chord_hold_timeout = 0
oneshot_timeout = 0
overload_tap_timeout = 0
