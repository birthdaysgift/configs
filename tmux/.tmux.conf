# remove all default keybinds
unbind -a
set -g prefix None

# TODO fix pasting to vim over ssh
set -g terminal-overrides ',xterm-256color:Tc'
set -g assume-paste-time 1
set -g allow-passthrough on
set -g mode-keys vi
set -g focus-events on
set -g mouse on
set -as terminal-features ',rxvt-unicode-256color:clipboard'


# need to exit command prompts on Escape
set-option -g status-keys emacs

# window numbers start from 1
set -g base-index 1

# renumber windows if window is closed
set -g renumber-windows on

# configure status line
set -g status on
set -g status-interval 1
set -g status-position top
set -g status-style fg=#ffffff,bg=#000000
set -g status-justify right
set -g status-left-length 40
set -g status-left " #{p13:#[fg=#555753]#{client_key_table}#{?pane_synchronized, #[fg=#5b9ccf]#[bold][SYNC],}#{?window_zoomed_flag, #[fg=#5b9ccf]#[bold][ZOOM],}#{?#{==:#{window_name},_scrollback}, #[fg=#c4a000]#[bold][SCROLLBACK],}}"
set -g status-right " | Session: #[bold]#{session_name} | %H:%M:%S "
set -g status-right-style fg=#555753


# configure pane borders
set -g pane-border-status top
set -g pane-border-style fg=#555753
set -g pane-active-border-style fg=#5b9ccf
set -g pane-border-format "[#{pane_index}]"

# popup style
set -g popup-border-lines rounded
set -g popup-border-style fg=#5b9ccf

# configure window status line
set -g window-status-current-format "#{window_index}:#{window_name}"
set -g window-status-format "#{window_index}:#{window_name}"
set -g window-status-current-style fg=#5b9ccf,bold
set -g window-status-style fg=#555753

# messages style
set -g message-style fg=#000000,bg=#5b9ccf
set -g message-command-style fg=#ffffff,bg=#5b9ccf

# disable escape-key "lag"
set -g escape-time 0

# setup LOCKED mode as default
set -g key-table LOCKED


# exit copy mode on Escape
# (since we have separate keybindings for SCROLL mode
# this setting basically adds exit-on-escape behavior
# to so called "view-mode" which is started when
# some tmux command with large output executed,
# for example :list-commands)
bind -T copy-mode-vi Escape send-keys -X cancel


##### LOCKED MODE #####

bind -T LOCKED C-l switch-client -T NORMAL

# switch to scroll mode
bind -T NORMAL l switch-client -T SCROLL \; copy-mode
bind -T NORMAL C-l switch-client -T SCROLL \; copy-mode

# enable mouse scrolling in LOCKED mode
bind -T LOCKED WheelUpPane \
  if-shell -F '#{pane_in_mode}' \
  'send-keys -X scroll-up' \
  'copy-mode -e; send-keys -X scroll-up'
bind -T LOCKED WheelDownPane \
  if-shell -F '#{pane_in_mode}' \
  'send-keys -X scroll-down' \
  'copy-mode -e; send-keys -X scroll-down'


##### SCROLL MODE #####

bind -T SCROLL Escape \
  if-shell -F '#{pane_in_mode}' \
  'send-keys -X cancel ; switch-client -T LOCKED' \
  'switch-client -T LOCKED'

# one line up
bind -T SCROLL k \
  if-shell -F '#{pane_in_mode}' \
  'send-keys -X scroll-up ; switch-client -T SCROLL' \
  'send-keys -X scroll-up ; switch-client -T SCROLL'

# one line down
bind -T SCROLL j \
  if-shell -F '#{pane_in_mode}' \
  'send-keys -X scroll-down ; switch-client -T SCROLL' \
  'send-keys -X scroll-down ; switch-client -T SCROLL'

# half page up
bind -T SCROLL C-u \
  if-shell -F '#{pane_in_mode}' \
  'send-keys -X halfpage-up ; switch-client -T SCROLL' \
  'send-keys -X halfpage-up ; switch-client -T SCROLL'

# half page down
bind -T SCROLL C-d \
  if-shell -F '#{pane_in_mode}' \
  'send-keys -X halfpage-down ; switch-client -T SCROLL' \
  'send-keys -X halfpage-down ; switch-client -T SCROLL'


##### NORMAL MODE #####

# command prompt
bind -T NORMAL : command-prompt

bind -T NORMAL L display-popup -w 90% -h 90% -E -d "#{pane_current_path}" "lazygit"

# switch to SESSION mode
bind -T NORMAL o switch-client -T SESSION
bind -T NORMAL C-o switch-client -T SESSION

bind -T NORMAL P run-shell ~/code/configs/tmux/python-scratch.sh
bind -T NORMAL p display-popup -E -d "#{pane_current_path}" "/usr/bin/env python3"
bind -T NORMAL C-p display-popup -w 80% -h 80% -e VIRTUAL_ENV=foo "echo $VIRTUAL_ENV"

bind -T NORMAL b display-popup -E -d "#{pane_current_path}" "bash"
bind -T NORMAL C-b display-popup -E -d "#{pane_current_path}" "bash"


##### SESSION MODE #####

bind -T SESSION n command-prompt -p "Session name:" "new-session -A -s %%"
bind -T SESSION p switch-client -l
bind -T SESSION D display-popup -E \
  " \
    tmux list-sessions -F '#{session_name}' \
    | fzf --layout=reverse --padding='2%' \
    | xargs tmux kill-session -t \
  "
bind -T SESSION o display-popup -E \
  " \
    tmux list-sessions -F '#{session_name}' \
    | fzf --layout=reverse --padding='2%' \
    | tee >(xargs -I {} tmux switch-client -t {}) \
    | xargs -I {} echo {} > /tmp/.tmux-session \
  "
bind -T SESSION C-o display-popup -E \
  " \
    tmux list-sessions -F '#{session_name}' \
    | fzf --layout=reverse --padding='2%' \
    | tee >(xargs -I {} tmux switch-client -t {}) \
    | xargs -I {} echo {} > /tmp/.tmux-session \
  "
bind -T SESSION d detach-client
bind -T SESSION C-d detach-client
# saving/restoring sessions requires resurrect plugin
bind -T SESSION S run-shell "#{@resurrect-save-script-path}"
bind -T SESSION R run-shell "#{@resurrect-restore-script-path}"

bind -T SESSION r \
  command-prompt -p "Rename session:" -I "#{session_name}" \
  "rename-session '%%'" \; \
  switch-client -T LOCKED

# reload config
bind -T NORMAL R source-file ~/.tmux.conf \; display-message -d 500 "tmux config reloaded"

# switch to pane mode
bind -T NORMAL j switch-client -T PANE
bind -T NORMAL Enter switch-client -T PANE

# switch to window mode
bind -T NORMAL k switch-client -T WINDOW
bind -T NORMAL C-k switch-client -T WINDOW

# switch to resize mode
bind -T NORMAL r switch-client -T RESIZE
bind -T NORMAL C-r switch-client -T RESIZE

# switch to move mode
bind -T NORMAL m switch-client -T MOVE

# switch display pane numbers
bind -T NORMAL n display-panes -d 0
bind -T NORMAL C-n display-panes -d 0

# switch back to locked mode
bind -T NORMAL Escape switch-client -T LOCKED

# edit scrollback
bind -T NORMAL e run-shell "~/scrollback.sh"
bind -T NORMAL C-e run-shell "~/scrollback.sh"


##### PANE MODE #####

# exit pane mode
bind -T PANE Escape switch-client -T LOCKED

# select pane below
bind -T PANE j run-shell ~/code/configs/tmux/select-pane-down.sh
bind -T PANE Enter run-shell ~/code/configs/tmux/select-pane-down.sh

# select pane above
bind -T PANE k run-shell ~/code/configs/tmux/select-pane-up.sh
bind -T PANE C-k run-shell ~/code/configs/tmux/select-pane-up.sh

# select pane left
bind -T PANE h run-shell ~/code/configs/tmux/select-pane-left.sh
bind -T PANE BSpace run-shell ~/code/configs/tmux/select-pane-left.sh

# select pane right
bind -T PANE l run-shell ~/code/configs/tmux/select-pane-right.sh
bind -T PANE C-l run-shell ~/code/configs/tmux/select-pane-right.sh

# create pane below
bind -T PANE J split-window -v -c "#{pane_current_path}" \; switch-client -T LOCKED

# create pane above
bind -T PANE K split-window -v -b -c "#{pane_current_path}" \; switch-client -T LOCKED

# create pane right
bind -T PANE L split-window -h -c "#{pane_current_path}" \; switch-client -T LOCKED

# create pane left
bind -T PANE H split-window -h -b -c "#{pane_current_path}" \; switch-client -T LOCKED

# close pane
bind -T PANE x kill-pane \; switch-client -T LOCKED
bind -T PANE C-x kill-pane \; switch-client -T LOCKED

# toggle pane focus
bind -T PANE f run-shell ~/code/configs/tmux/zoom.sh
bind -T PANE C-f run-shell ~/code/configs/tmux/zoom.sh

# synchronize panes
bind -T PANE s set-option -w synchronize-panes \; switch-client -T LOCKED
bind -T PANE C-s set-option -w synchronize-panes \; switch-client -T LOCKED


# rename pane
bind -T PANE r \
  command-prompt -p "Rename pane:" -I "#{pane_title}" \
  "select-pane -T '%%'" \; \
  switch-client -T LOCKED
bind -T PANE C-r \
  command-prompt -p "Rename pane:" -I "#{pane_title}" \
  "select-pane -T '%%'" \; \
  switch-client -T LOCKED


##### RESIZE MODE #####

# exit resize mode
bind -T RESIZE Escape switch-client -T LOCKED

# resize down
bind -T RESIZE j resize-pane -D 2 \; switch-client -T RESIZE
bind -T RESIZE Enter resize-pane -D 2 \; switch-client -T RESIZE

# resize up
bind -T RESIZE k resize-pane -U 2 \; switch-client -T RESIZE
bind -T RESIZE C-k resize-pane -U 2 \; switch-client -T RESIZE


# resize left
bind -T RESIZE h resize-pane -L 5 \; switch-client -T RESIZE
bind -T RESIZE BSpace resize-pane -L 5 \; switch-client -T RESIZE

# resize right
bind -T RESIZE l resize-pane -R 5 \; switch-client -T RESIZE
bind -T RESIZE C-l resize-pane -R 5 \; switch-client -T RESIZE



##### WINDOW MODE #####

# new window
bind -T WINDOW n new-window -c "#{pane_current_path}" \; switch-client -T LOCKED
bind -T WINDOW C-n new-window -c "#{pane_current_path}" \; switch-client -T LOCKED

# close window
bind -T WINDOW x kill-window \; switch-client -T LOCKED
bind -T WINDOW C-x kill-window \; switch-client -T LOCKED

# go to left window
bind -T WINDOW h previous-window \; switch-client -T LOCKED
bind -T WINDOW BSpace previous-window \; switch-client -T LOCKED

# go to right window
bind -T WINDOW l next-window \; switch-client -T LOCKED
bind -T WINDOW C-l next-window \; switch-client -T LOCKED


# go to 1 window
bind -T WINDOW 1 select-window -t 1 \; switch-client -T LOCKED
bind -T WINDOW C-1 select-window -t 1 \; switch-client -T LOCKED
bind -T NORMAL a select-window -t 1 \; switch-client -T LOCKED
bind -T NORMAL C-a select-window -t 1 \; switch-client -T LOCKED

# go to 2 window
bind -T WINDOW 2 select-window -t 2 \; switch-client -T LOCKED
bind -T WINDOW C-2 select-window -t 2 \; switch-client -T LOCKED
bind -T NORMAL s select-window -t 2 \; switch-client -T LOCKED
bind -T NORMAL C-s select-window -t 2 \; switch-client -T LOCKED

# go to 3 window
bind -T WINDOW 3 select-window -t 3 \; switch-client -T LOCKED
bind -T WINDOW C-3 select-window -t 3 \; switch-client -T LOCKED
bind -T NORMAL d select-window -t 3 \; switch-client -T LOCKED
bind -T NORMAL C-d select-window -t 3 \; switch-client -T LOCKED

# go to 4 window
bind -T WINDOW 4 select-window -t 4 \; switch-client -T LOCKED
bind -T WINDOW C-4 select-window -t 4 \; switch-client -T LOCKED
bind -T NORMAL f select-window -t 4 \; switch-client -T LOCKED
bind -T NORMAL C-f select-window -t 4 \; switch-client -T LOCKED

# go to 5 window
bind -T WINDOW 5 select-window -t 5 \; switch-client -T LOCKED
bind -T WINDOW C-5 select-window -t 5 \; switch-client -T LOCKED
bind -T NORMAL g select-window -t 5 \; switch-client -T LOCKED
bind -T NORMAL C-g select-window -t 5 \; switch-client -T LOCKED


# go to 6 window
bind -T WINDOW 6 select-window -t 6 \; switch-client -T LOCKED
bind -T WINDOW C-6 select-window -t 6 \; switch-client -T LOCKED
bind -T NORMAL h select-window -t 6 \; switch-client -T LOCKED
bind -T NORMAL BSpace select-window -t 6 \; switch-client -T LOCKED

# go to 7 window
bind -T WINDOW 7 select-window -t 7 \; switch-client -T LOCKED
bind -T WINDOW C-7 select-window -t 7 \; switch-client -T LOCKED

# go to 8 window
bind -T WINDOW 8 select-window -t 8 \; switch-client -T LOCKED
bind -T WINDOW C-8 select-window -t 8 \; switch-client -T LOCKED

# go to 9 window
bind -T WINDOW 9 select-window -t 9 \; switch-client -T LOCKED
bind -T WINDOW C-9 select-window -t 9 \; switch-client -T LOCKED

# rename window
bind -T WINDOW r command-prompt -I "#W" "rename-window '%%'" \; switch-client -T LOCKED


##### MOVE MODE #####

# move window left
bind -T MOVE i swap-window -d -t -1 \; switch-client -T MOVE
bind -T MOVE C-i swap-window -d -t -1 \; switch-client -T MOVE

# move window right
bind -T MOVE o swap-window -d -t +1 \; switch-client -T MOVE
bind -T MOVE C-o swap-window -d -t +1 \; switch-client -T MOVE

# move pane left
bind -T MOVE h \
  if-shell -F \
  '#{pane_at_left}' \
  'display-message "pane is at the left" ; switch-client -T MOVE' \
  'select-pane -m ; select-pane -L ; swap-pane ; select-pane -M ; select-pane -L ; switch-client -T MOVE'

# move pane right
bind -T MOVE l \
  if-shell -F \
  '#{pane_at_right}' \
  'display-message "pane is at the right" ; switch-client -T MOVE' \
  'select-pane -m ; select-pane -R ; swap-pane ; select-pane -M ; select-pane -R ; switch-client -T MOVE'


# move pane up
bind -T MOVE k \
  if-shell -F \
  '#{pane_at_top}' \
  'display-message "pane is at the top" ; switch-client -T MOVE' \
  'select-pane -m ; select-pane -U ; swap-pane ; select-pane -M ; select-pane -U ; switch-client -T MOVE'

# move pane down
bind -T MOVE j \
  if-shell -F \
  '#{pane_at_bottom}' \
  'display-message "pane is at the bottom" ; switch-client -T MOVE' \
  'select-pane -m ; select-pane -D ; swap-pane ; select-pane -M ; select-pane -D ; switch-client -T MOVE'

# join pane up
bind -T MOVE K \
  if-shell -F \
  '#{pane_at_top}' \
  'display-message "pane is at the top" ; switch-client -T MOVE' \
  'select-pane -m ; select-pane -U ; join-pane -h ; select-pane -M ; switch-client -T MOVE'

# join pane down
bind -T MOVE J \
  if-shell -F \
  '#{pane_at_bottom}' \
  'display-message "pane is at the bottom" ; switch-client -T LOCKED' \
  'select-pane -m ; select-pane -D ; join-pane -h ; select-pane -M ; switch-client -T LOCKED'


# join pane left
bind -T MOVE H \
  if-shell -F \
  '#{pane_at_left}' \
  'display-message "pane is at the left" ; switch-client -T LOCKED' \
  'select-pane -m ; select-pane -L ; join-pane -v; select-pane -M ; switch-client -T LOCKED'

# join pane right
bind -T MOVE L \
  if-shell -F \
  '#{pane_at_right}' \
  'display-message "pane is at the right" ; switch-client -T LOCKED' \
  'select-pane -m ; select-pane -R ; join-pane -v ; select-pane -M ; switch-client -T LOCKED'


# extend pane left
bind -T MOVE BSpace \
  if-shell -F \
  '#{pane_at_left}' \
  'display-message "pane is at the left" ; switch-client -T LOCKED' \
  'select-pane -m ; select-pane -L ; join-pane -v -f; select-pane -M ; switch-client -T LOCKED'


# extend pane right
bind -T MOVE C-l \
  if-shell -F \
  '#{pane_at_right}' \
  'display-message "pane is at the right" ; switch-client -T LOCKED' \
  'select-pane -m ; select-pane -R ; join-pane -v -f; select-pane -M ; switch-client -T LOCKED'


# extend pane bottom
bind -T MOVE Enter \
  if-shell -F \
  '#{pane_at_bottom}' \
  'display-message "pane is at the bottom" ; switch-client -T LOCKED' \
  'select-pane -m ; select-pane -D ; join-pane -h -f -b; select-pane -M ; switch-client -T LOCKED'


# persists sessions
run-shell ~/code/tmux-resurrect/resurrect.tmux

set -g @continuum-save-interval '1'
set -g @continuum-restore 'on'

# persists sessions on the background
run-shell ~/code/tmux-continuum/continuum.tmux


