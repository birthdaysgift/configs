gui:
  sidePanelWidth: 0.25
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 5

  showNumstatInFilesView: true
  statusPanelView: allBranchesLog

git:
  autoForwardBranches: none

  log:
    order: topo-order
    showGraph: never

  autoStageResolvedConflicts: false

  branchLogCmd: git log

  merging:
    args: "--no-ff"

  paging:
    pager: >
      delta \
        --dark \
        --line-numbers \
        --paging=never \
        --line-numbers-left-format='{nm} ' \
        --line-numbers-right-format='{np} ' \
        --hunk-header-style=omit \
        --side-by-side



notARepository: quit

keybinding:
  universal:
    quit: <esc>
